name: Auto-update Włocławek GTFS-RT

on:
  schedule:
    - cron: '*/5 * * * *'  # Uruchomienie automatycznie co 5 minut
  workflow_dispatch:      # Pozwala na ręczne uruchomienie w każdej chwili jednym kliknięciem

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v3

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacja zależności
        run: |
          pip install requests gtfs-realtime-bindings playwright
          playwright install chromium

      - name: Uruchomienie skryptu zbierającego
        run: python skrypt.py

      - name: Zapis pliku .pb w repozytorium
        run: |
          git config --global user.name "GTFS Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add wloclawek_gtfs_rt.pb
          git commit -m "Automatyczna aktualizacja GTFS-RT $(date)" || echo "Brak zmian"
          git push
